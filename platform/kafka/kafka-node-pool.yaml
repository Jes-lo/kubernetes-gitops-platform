apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  name: dual-role
  namespace: platform-kafka
  labels:
    strimzi.io/cluster: platform-kafka
spec:
  replicas: 3

  roles:
    - controller
    - broker

  storage:
    type: jbod
    volumes:
      - id: 0
        type: persistent-claim
        size: 1Gi
        class: standard
        deleteClaim: false
        kraftMetadata: shared
