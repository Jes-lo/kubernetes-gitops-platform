name: CI Validation

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  terraform:
    name: Terraform Validation
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.4
          terraform_wrapper: false

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive

      - name: Initialize Terraform without backend
        run: terraform -chdir=terraform/bootstrap init -backend=false -input=false

      - name: Validate Terraform
        run: terraform -chdir=terraform/bootstrap validate -no-color

  repository-policy:
    name: Repository Policy
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Reject committed private key material
        shell: bash
        run: |
          set -euo pipefail

          set +e
          git grep -nEI -e \
            '-----BEGIN ((OPENSSH|RSA|EC|DSA) )?PRIVATE[[:space:]]+KEY-----'
          GREP_EXIT=$?
          set -e

          case "$GREP_EXIT" in
            0)
              echo "::error::Private key material detected in tracked files."
              exit 1
              ;;
            1)
              echo "No private key material detected."
              ;;
            *)
              echo "::error::Private key scan failed with exit code ${GREP_EXIT}."
              exit "$GREP_EXIT"
              ;;
          esac

      - name: Reject Terraform state and plan artifacts
        shell: bash
        run: |
          set -euo pipefail

          TRACKED="$(
            git ls-files \
              | grep -E '(^|/)\.terraform/|(^|/)terraform\.tfstate($|\.)|\.tfplan$|(^|/)tfplan$' \
              || true
          )"

          if [ -n "$TRACKED" ]; then
            echo "::error::Terraform runtime artifacts are tracked:"
            printf '%s\n' "$TRACKED"
            exit 1
          fi

          echo "No Terraform state or plan artifacts are tracked."

  demo-api:
    name: Demo API Validation
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Show validation tool versions
        shell: bash
        run: |
          set -euo pipefail

          docker --version
          helm version --short

      - name: Validate pinned Node base image
        shell: bash
        run: |
          set -euo pipefail

          NODE_BASE_IMAGE="$(
            awk '/^FROM / {print $2; exit}' app/demo-api/Dockerfile
          )"

          case "$NODE_BASE_IMAGE" in
            node@sha256:*)
              echo "Pinned base image: $NODE_BASE_IMAGE"
              ;;
            *)
              echo "::error::Dockerfile base image must be pinned by digest."
              exit 1
              ;;
          esac

          echo "NODE_BASE_IMAGE=$NODE_BASE_IMAGE" >> "$GITHUB_ENV"

      - name: Run unit tests with pinned Node image
        shell: bash
        run: |
          set -euo pipefail

          docker pull "$NODE_BASE_IMAGE"

          docker run             --rm             --user 1000:1000             --volume "$PWD/app/demo-api:/workspace:ro"             --workdir /workspace             "$NODE_BASE_IMAGE"             node --test

      - name: Build demo API image
        shell: bash
        run: |
          set -euo pipefail

          docker build             --pull=false             --tag demo-api:ci             app/demo-api

          IMAGE_USER="$(
            docker image inspect               demo-api:ci               --format '{{.Config.User}}'
          )"

          if [ "$IMAGE_USER" != "node" ]; then
            echo "::error::Runtime image user is '$IMAGE_USER', expected 'node'."
            exit 1
          fi

          echo "Runtime image user: $IMAGE_USER"

      - name: Run hardened container smoke test
        shell: bash
        run: |
          set -euo pipefail

          docker run             --detach             --name demo-api-ci             --read-only             --user 1000:1000             --cap-drop ALL             --security-opt no-new-privileges:true             --publish 127.0.0.1:3002:3000             --env APP_VERSION=ci             demo-api:ci

          READY=false

          for attempt in $(seq 1 20); do
            if curl               --fail               --silent               http://127.0.0.1:3002/readyz               >/dev/null
            then
              READY=true
              break
            fi

            sleep 1
          done

          if [ "$READY" != "true" ]; then
            echo "::error::demo-api did not become ready."
            docker logs demo-api-ci
            exit 1
          fi

          curl --fail --silent http://127.0.0.1:3002/
          echo
          curl --fail --silent http://127.0.0.1:3002/healthz
          echo
          curl --fail --silent http://127.0.0.1:3002/readyz
          echo
          curl --fail --silent http://127.0.0.1:3002/version
          echo

      - name: Validate container security
        shell: bash
        run: |
          set -euo pipefail

          IDENTITY="$(docker exec demo-api-ci id)"
          PROCESS_SECURITY="$(
            docker exec demo-api-ci               sh -c 'grep -E "^(Uid|Gid|CapEff|NoNewPrivs|Seccomp):" /proc/1/status'
          )"

          echo "$IDENTITY"
          echo "$PROCESS_SECURITY"

          echo "$IDENTITY"             | grep -q 'uid=1000(node) gid=1000(node)'

          echo "$PROCESS_SECURITY"             | grep -q '^CapEff:[[:space:]]*0000000000000000$'

          echo "$PROCESS_SECURITY"             | grep -q '^NoNewPrivs:[[:space:]]*1$'

          echo "$PROCESS_SECURITY" \
            | grep -q '^Seccomp:[[:space:]]*2$'

          set +e

          docker exec             demo-api-ci             sh -c 'touch /app/ci-write-test'             >/tmp/write-test.out 2>&1

          WRITE_EXIT=$?

          set -e

          cat /tmp/write-test.out

          if [ "$WRITE_EXIT" -eq 0 ]; then
            echo "::error::Container root filesystem is writable."
            exit 1
          fi

          echo "Read-only root filesystem confirmed."

      - name: Validate Helm chart
        shell: bash
        run: |
          set -euo pipefail

          helm lint charts/demo-api

          helm template             demo-api             charts/demo-api             --namespace demo-dev             > /tmp/demo-api-rendered.yaml

          grep -q '^kind: ServiceAccount$' /tmp/demo-api-rendered.yaml
          grep -q '^kind: Service$' /tmp/demo-api-rendered.yaml
          grep -q '^kind: Deployment$' /tmp/demo-api-rendered.yaml

          grep -q 'runAsNonRoot: true' /tmp/demo-api-rendered.yaml
          grep -q 'runAsUser: 1000' /tmp/demo-api-rendered.yaml
          grep -q 'runAsGroup: 1000' /tmp/demo-api-rendered.yaml
          grep -q 'readOnlyRootFilesystem: true' /tmp/demo-api-rendered.yaml
          grep -q 'allowPrivilegeEscalation: false' /tmp/demo-api-rendered.yaml

      - name: Validate GitOps delivery configuration
        shell: bash
        run: |
          set -euo pipefail

          DEV_VALUES="gitops/environments/dev/demo-api/values.yaml"
          APPLICATION="gitops/applications/demo-api.yaml"
          PROJECT="gitops/projects/demo-platform.yaml"

          test -f "$DEV_VALUES"
          test -f "$APPLICATION"
          test -f "$PROJECT"

          (
            cd charts/demo-api
            helm lint . -f ../../gitops/environments/dev/demo-api/values.yaml
            helm template demo-api . --namespace demo-dev -f ../../gitops/environments/dev/demo-api/values.yaml > /tmp/demo-api-dev-rendered.yaml
          )

          IMAGE="$(
            awk '/^[[:space:]]*image:/ {
              gsub(/"/, "", $2)
              print $2
              exit
            }' /tmp/demo-api-dev-rendered.yaml
          )"

          case "$IMAGE" in
            ghcr.io/jes-lo/kubernetes-gitops-platform-demo-api@sha256:*)
              ;;
            *)
              echo "::error::Dev workload is not digest-pinned: $IMAGE"
              exit 1
              ;;
          esac

          DIGEST="${IMAGE##*@sha256:}"

          if ! printf '%s' "$DIGEST" | grep -Eq '^[0-9a-f]{64}$'; then
            echo "::error::Invalid SHA256 image digest: $DIGEST"
            exit 1
          fi

          if grep -q ':latest' /tmp/demo-api-dev-rendered.yaml; then
            echo "::error::Floating latest tag detected"
            exit 1
          fi

          grep -q 'imagePullSecrets:' /tmp/demo-api-dev-rendered.yaml
          grep -q -- '- name: ghcr-read' /tmp/demo-api-dev-rendered.yaml

          grep -q 'runAsNonRoot: true' /tmp/demo-api-dev-rendered.yaml
          grep -q 'readOnlyRootFilesystem: true' /tmp/demo-api-dev-rendered.yaml
          grep -q 'allowPrivilegeEscalation: false' /tmp/demo-api-dev-rendered.yaml

          grep -q 'repoURL: git@github.com:Jes-lo/kubernetes-gitops-platform.git' "$APPLICATION"
          grep -q 'targetRevision: main' "$APPLICATION"
          grep -q 'path: charts/demo-api' "$APPLICATION"
          grep -q '../../gitops/environments/dev/demo-api/values.yaml' "$APPLICATION"
          grep -q 'server: https://kubernetes.default.svc' "$APPLICATION"
          grep -q 'namespace: demo-dev' "$APPLICATION"
          grep -q 'prune: true' "$APPLICATION"
          grep -q 'selfHeal: true' "$APPLICATION"

          grep -q 'kind: Service$' "$PROJECT"
          grep -q 'kind: ServiceAccount$' "$PROJECT"
          grep -q 'kind: Deployment$' "$PROJECT"

          if grep -q 'kind: Secret$' "$PROJECT"; then
            echo "::error::AppProject must not whitelist Secret resources"
            exit 1
          fi

          set +e
          CREDENTIAL_SCAN_PATHS=(
            gitops/environments/dev/demo-api
            gitops/applications/demo-api.yaml
            charts/demo-api
          )

          grep -RniE \
            'ghp_|github_pat_|\.dockerconfigjson|^[[:space:]]*auths:' \
            "${CREDENTIAL_SCAN_PATHS[@]}"
          CREDENTIAL_SCAN_EXIT=$?
          set -e

          case "$CREDENTIAL_SCAN_EXIT" in
            0)
              echo "::error::Possible registry credential material detected"
              exit 1
              ;;
            1)
              echo "PASS: no registry credential material detected"
              ;;
            *)
              echo "::error::Credential scan failed with exit code ${CREDENTIAL_SCAN_EXIT}"
              exit "$CREDENTIAL_SCAN_EXIT"
              ;;
          esac

          echo "Validated dev image: $IMAGE"
          echo "PASS: GitOps delivery configuration validated"

      - name: Clean up test container
        if: always()
        shell: bash
        run: |
          docker rm -f demo-api-ci 2>/dev/null || true

  strimzi-operator:
    name: Strimzi Operator Validation
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Show Helm version
        shell: bash
        run: |
          set -euo pipefail
          helm version --short

      - name: Validate Strimzi GitOps configuration
        shell: bash
        run: |
          set -euo pipefail

          APPLICATION="gitops/applications/strimzi-operator.yaml"
          OPERATOR_PROJECT="gitops/projects/strimzi-operator.yaml"
          WORKLOAD_PROJECT="gitops/projects/kafka-platform.yaml"

          test -f "$APPLICATION"
          test -f "$OPERATOR_PROJECT"
          test -f "$WORKLOAD_PROJECT"

          grep -q "^  project: strimzi-operator$" "$APPLICATION"
          grep -q "repoURL: https://strimzi.io/charts/" "$APPLICATION"
          grep -q "chart: strimzi-kafka-operator" "$APPLICATION"
          grep -q "targetRevision: 1.2.0" "$APPLICATION"
          grep -q "argocd.argoproj.io/compare-options: ServerSideDiff=true" "$APPLICATION"
          grep -q "name: watchAnyNamespace" "$APPLICATION"
          grep -q "value: \"false\"" "$APPLICATION"
          grep -q "namespace: platform-kafka" "$APPLICATION"
          grep -q "CreateNamespace=true" "$APPLICATION"
          grep -q "ServerSideApply=true" "$APPLICATION"
          grep -q "prune: true" "$APPLICATION"
          grep -q "selfHeal: true" "$APPLICATION"

          grep -q "https://strimzi.io/charts/" "$OPERATOR_PROJECT"

          if grep -q "git@github.com:Jes-lo/kubernetes-gitops-platform.git" "$OPERATOR_PROJECT"; then
            echo "::error::Operator project must not allow the workload Git repository"
            exit 1
          fi

          grep -q "kind: Namespace$" "$OPERATOR_PROJECT"
          grep -q "name: platform-kafka$" "$OPERATOR_PROJECT"
          grep -q "kind: CustomResourceDefinition$" "$OPERATOR_PROJECT"
          grep -q "kind: ClusterRole$" "$OPERATOR_PROJECT"
          grep -q "kind: ClusterRoleBinding$" "$OPERATOR_PROJECT"
          grep -q "kind: ConfigMap$" "$OPERATOR_PROJECT"
          grep -q "kind: ServiceAccount$" "$OPERATOR_PROJECT"
          grep -q "kind: RoleBinding$" "$OPERATOR_PROJECT"
          grep -q "kind: Deployment$" "$OPERATOR_PROJECT"

          grep -q "git@github.com:Jes-lo/kubernetes-gitops-platform.git" "$WORKLOAD_PROJECT"

          if grep -q "https://strimzi.io/charts/" "$WORKLOAD_PROJECT"; then
            echo "::error::Kafka workload project must not allow the Strimzi Helm repository"
            exit 1
          fi

          if grep -q "clusterResourceWhitelist:" "$WORKLOAD_PROJECT"; then
            echo "::error::Kafka workload project must not have cluster-scoped permissions"
            exit 1
          fi

          grep -q "kind: Kafka$" "$WORKLOAD_PROJECT"
          grep -q "kind: KafkaNodePool$" "$WORKLOAD_PROJECT"
          grep -q "kind: KafkaTopic$" "$WORKLOAD_PROJECT"

          for PROJECT in "$OPERATOR_PROJECT" "$WORKLOAD_PROJECT"; do
            if grep -Eq "group:[[:space:]]*[\"']?\*|kind:[[:space:]]*[\"']?\*" "$PROJECT"; then
              echo "::error::Wildcard AppProject resource permission detected in $PROJECT"
              exit 1
            fi

            if grep -q "kind: Secret$" "$PROJECT"; then
              echo "::error::AppProject must not directly whitelist Secret resources"
              exit 1
            fi
          done

          echo "PASS: Strimzi AppProject isolation validated"

      - name: Validate pinned Strimzi chart
        shell: bash
        run: |
          set -euo pipefail

          helm repo add strimzi https://strimzi.io/charts/
          helm repo update

          helm template \
            strimzi-operator \
            strimzi/strimzi-kafka-operator \
            --version 1.2.0 \
            --namespace platform-kafka \
            --set watchAnyNamespace=false \
            --include-crds \
            > /tmp/strimzi-rendered.yaml

          test "$(grep -c "^kind: CustomResourceDefinition$" /tmp/strimzi-rendered.yaml)" -eq 10
          test "$(grep -c "^kind: ClusterRole$" /tmp/strimzi-rendered.yaml)" -eq 7
          test "$(grep -c "^kind: ClusterRoleBinding$" /tmp/strimzi-rendered.yaml)" -eq 3
          test "$(grep -c "^kind: RoleBinding$" /tmp/strimzi-rendered.yaml)" -eq 4
          test "$(grep -c "^kind: Deployment$" /tmp/strimzi-rendered.yaml)" -eq 1
          test "$(grep -c "^kind: ServiceAccount$" /tmp/strimzi-rendered.yaml)" -eq 1
          test "$(grep -c "^kind: ConfigMap$" /tmp/strimzi-rendered.yaml)" -eq 1

          grep -q "name: kafkas.kafka.strimzi.io" /tmp/strimzi-rendered.yaml
          grep -q "name: kafkanodepools.kafka.strimzi.io" /tmp/strimzi-rendered.yaml
          grep -q "name: kafkatopics.kafka.strimzi.io" /tmp/strimzi-rendered.yaml

          echo "PASS: pinned Strimzi 1.2.0 chart validated"

  security:
    name: Security Validation
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Scan IaC misconfigurations
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          format: table
          exit-code: '1'
          severity: HIGH,CRITICAL
          hide-progress: true
          version: v0.74.0

      - name: Scan repository for secrets
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: secret
          format: table
          exit-code: '1'
          hide-progress: true
          version: v0.74.0
          skip-setup-trivy: true
