name: CI Validation

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  terraform:
    name: Terraform Validation
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.4
          terraform_wrapper: false

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive

      - name: Initialize Terraform without backend
        run: terraform -chdir=terraform/bootstrap init -backend=false -input=false

      - name: Validate Terraform
        run: terraform -chdir=terraform/bootstrap validate -no-color

  repository-policy:
    name: Repository Policy
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Reject committed private key material
        shell: bash
        run: |
          set -euo pipefail

          set +e
          git grep -nEI -e \
            '-----BEGIN ((OPENSSH|RSA|EC|DSA) )?PRIVATE[[:space:]]+KEY-----'
          GREP_EXIT=$?
          set -e

          case "$GREP_EXIT" in
            0)
              echo "::error::Private key material detected in tracked files."
              exit 1
              ;;
            1)
              echo "No private key material detected."
              ;;
            *)
              echo "::error::Private key scan failed with exit code ${GREP_EXIT}."
              exit "$GREP_EXIT"
              ;;
          esac

      - name: Reject Terraform state and plan artifacts
        shell: bash
        run: |
          set -euo pipefail

          TRACKED="$(
            git ls-files \
              | grep -E '(^|/)\.terraform/|(^|/)terraform\.tfstate($|\.)|\.tfplan$|(^|/)tfplan$' \
              || true
          )"

          if [ -n "$TRACKED" ]; then
            echo "::error::Terraform runtime artifacts are tracked:"
            printf '%s\n' "$TRACKED"
            exit 1
          fi

          echo "No Terraform state or plan artifacts are tracked."

  security:
    name: Security Validation
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Scan IaC misconfigurations
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          format: table
          exit-code: '1'
          severity: HIGH,CRITICAL
          hide-progress: true
          version: v0.74.0

      - name: Scan repository for secrets
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: secret
          format: table
          exit-code: '1'
          hide-progress: true
          version: v0.74.0
          skip-setup-trivy: true
