name: CI Validation

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  terraform:
    name: Terraform Validation
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.4
          terraform_wrapper: false

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive

      - name: Initialize Terraform without backend
        run: terraform -chdir=terraform/bootstrap init -backend=false -input=false

      - name: Validate Terraform
        run: terraform -chdir=terraform/bootstrap validate -no-color

  repository-policy:
    name: Repository Policy
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Reject committed private key material
        shell: bash
        run: |
          set -euo pipefail

          set +e
          git grep -nEI -e \
            '-----BEGIN ((OPENSSH|RSA|EC|DSA) )?PRIVATE[[:space:]]+KEY-----'
          GREP_EXIT=$?
          set -e

          case "$GREP_EXIT" in
            0)
              echo "::error::Private key material detected in tracked files."
              exit 1
              ;;
            1)
              echo "No private key material detected."
              ;;
            *)
              echo "::error::Private key scan failed with exit code ${GREP_EXIT}."
              exit "$GREP_EXIT"
              ;;
          esac

      - name: Reject Terraform state and plan artifacts
        shell: bash
        run: |
          set -euo pipefail

          TRACKED="$(
            git ls-files \
              | grep -E '(^|/)\.terraform/|(^|/)terraform\.tfstate($|\.)|\.tfplan$|(^|/)tfplan$' \
              || true
          )"

          if [ -n "$TRACKED" ]; then
            echo "::error::Terraform runtime artifacts are tracked:"
            printf '%s\n' "$TRACKED"
            exit 1
          fi

          echo "No Terraform state or plan artifacts are tracked."

  demo-api:
    name: Demo API Validation
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Show validation tool versions
        shell: bash
        run: |
          set -euo pipefail

          docker --version
          helm version --short

      - name: Validate pinned Node base image
        shell: bash
        run: |
          set -euo pipefail

          NODE_BASE_IMAGE="$(
            awk '/^FROM / {print $2; exit}' app/demo-api/Dockerfile
          )"

          case "$NODE_BASE_IMAGE" in
            node@sha256:*)
              echo "Pinned base image: $NODE_BASE_IMAGE"
              ;;
            *)
              echo "::error::Dockerfile base image must be pinned by digest."
              exit 1
              ;;
          esac

          echo "NODE_BASE_IMAGE=$NODE_BASE_IMAGE" >> "$GITHUB_ENV"

      - name: Run unit tests with pinned Node image
        shell: bash
        run: |
          set -euo pipefail

          docker pull "$NODE_BASE_IMAGE"

          docker run             --rm             --user 1000:1000             --volume "$PWD/app/demo-api:/workspace:ro"             --workdir /workspace             "$NODE_BASE_IMAGE"             node --test

      - name: Build demo API image
        shell: bash
        run: |
          set -euo pipefail

          docker build             --pull=false             --tag demo-api:ci             app/demo-api

          IMAGE_USER="$(
            docker image inspect               demo-api:ci               --format '{{.Config.User}}'
          )"

          if [ "$IMAGE_USER" != "node" ]; then
            echo "::error::Runtime image user is '$IMAGE_USER', expected 'node'."
            exit 1
          fi

          echo "Runtime image user: $IMAGE_USER"

      - name: Run hardened container smoke test
        shell: bash
        run: |
          set -euo pipefail

          docker run             --detach             --name demo-api-ci             --read-only             --user 1000:1000             --cap-drop ALL             --security-opt no-new-privileges:true             --publish 127.0.0.1:3002:3000             --env APP_VERSION=ci             demo-api:ci

          READY=false

          for attempt in $(seq 1 20); do
            if curl               --fail               --silent               http://127.0.0.1:3002/readyz               >/dev/null
            then
              READY=true
              break
            fi

            sleep 1
          done

          if [ "$READY" != "true" ]; then
            echo "::error::demo-api did not become ready."
            docker logs demo-api-ci
            exit 1
          fi

          curl --fail --silent http://127.0.0.1:3002/
          echo
          curl --fail --silent http://127.0.0.1:3002/healthz
          echo
          curl --fail --silent http://127.0.0.1:3002/readyz
          echo
          curl --fail --silent http://127.0.0.1:3002/version
          echo

      - name: Validate container security
        shell: bash
        run: |
          set -euo pipefail

          IDENTITY="$(docker exec demo-api-ci id)"
          PROCESS_SECURITY="$(
            docker exec demo-api-ci               sh -c 'grep -E "^(Uid|Gid|CapEff|NoNewPrivs|Seccomp):" /proc/1/status'
          )"

          echo "$IDENTITY"
          echo "$PROCESS_SECURITY"

          echo "$IDENTITY"             | grep -q 'uid=1000(node) gid=1000(node)'

          echo "$PROCESS_SECURITY"             | grep -q '^CapEff:[[:space:]]*0000000000000000$'

          echo "$PROCESS_SECURITY"             | grep -q '^NoNewPrivs:[[:space:]]*1$'

          echo "$PROCESS_SECURITY" \
            | grep -q '^Seccomp:[[:space:]]*2$'

          set +e

          docker exec             demo-api-ci             sh -c 'touch /app/ci-write-test'             >/tmp/write-test.out 2>&1

          WRITE_EXIT=$?

          set -e

          cat /tmp/write-test.out

          if [ "$WRITE_EXIT" -eq 0 ]; then
            echo "::error::Container root filesystem is writable."
            exit 1
          fi

          echo "Read-only root filesystem confirmed."

      - name: Validate Helm chart
        shell: bash
        run: |
          set -euo pipefail

          helm lint charts/demo-api

          helm template             demo-api             charts/demo-api             --namespace demo-dev             > /tmp/demo-api-rendered.yaml

          grep -q '^kind: ServiceAccount$' /tmp/demo-api-rendered.yaml
          grep -q '^kind: Service$' /tmp/demo-api-rendered.yaml
          grep -q '^kind: Deployment$' /tmp/demo-api-rendered.yaml

          grep -q 'runAsNonRoot: true' /tmp/demo-api-rendered.yaml
          grep -q 'runAsUser: 1000' /tmp/demo-api-rendered.yaml
          grep -q 'runAsGroup: 1000' /tmp/demo-api-rendered.yaml
          grep -q 'readOnlyRootFilesystem: true' /tmp/demo-api-rendered.yaml
          grep -q 'allowPrivilegeEscalation: false' /tmp/demo-api-rendered.yaml

      - name: Clean up test container
        if: always()
        shell: bash
        run: |
          docker rm -f demo-api-ci 2>/dev/null || true

  security:
    name: Security Validation
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Scan IaC misconfigurations
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          format: table
          exit-code: '1'
          severity: HIGH,CRITICAL
          hide-progress: true
          version: v0.74.0

      - name: Scan repository for secrets
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: secret
          format: table
          exit-code: '1'
          hide-progress: true
          version: v0.74.0
          skip-setup-trivy: true
