apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: demo-dev-bootstrap
  namespace: argocd
spec:
  project: demo-platform

  source:
    repoURL: git@github.com:Jes-lo/kubernetes-gitops-platform.git
    targetRevision: main
    path: gitops/environments/dev/bootstrap

  destination:
    server: https://kubernetes.default.svc
    namespace: demo-dev

  syncPolicy:
    automated:
      enabled: true
      prune: true
      selfHeal: true
